$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
stack: 'backend'

tasks:
  dev:
    command: 'wrangler dev'
    preset: 'server'

  # Bundles without deploying, to validate the worker in CI.
  build:
    command: 'wrangler deploy --dry-run --outdir dist'
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - 'dist'

  test:
    command: 'pnpm exec vitest run'
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
      - '/tsconfig.options.json'

  deploy:
    command: 'wrangler deploy'
    deps: ['typecheck', 'test']
    options:
      cache: false
      runInCI: false
