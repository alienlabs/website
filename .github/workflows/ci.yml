name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup toolchain (proto + moon from .prototools)
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          # Same version moon (2.5.4) wants; otherwise moon installs it mid-run while parallel
          # tasks are already executing the proto shims (intermittent "Permission denied").
          proto-version: '0.60.2'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Installs moon's toolchains (incl. its own proto) before any tasks run in parallel; doing it
      # lazily inside `moon ci` races the proto shims ("proto-shim: Permission denied").
      - name: Setup moon toolchains
        run: moon setup

      - name: Package conventions
        run: pnpm pkg-lint

      - name: Format
        run: pnpm format-check

      - name: Dead code and dependencies
        run: pnpm knip

      - name: Build, lint, typecheck (affected)
        run: moon ci --color
