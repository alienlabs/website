name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Setup toolchain (proto + moon from .prototools)
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          # Same version moon (2.5.4) wants; otherwise moon installs it mid-run while parallel
          # tasks are already executing the proto shims (intermittent "Permission denied").
          proto-version: '0.60.2'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Installs moon's toolchains (incl. its own proto) before any tasks run in parallel; doing it
      # lazily inside `moon ci` races the proto shims ("proto-shim: Permission denied").
      - name: Setup moon toolchains
        run: moon setup

      - name: Deploy web to Cloudflare
        run: moon run web-site:deploy --color
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
